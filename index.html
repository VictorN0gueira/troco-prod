    <style>
      /* Smooth scrolling */
      html { scroll-behavior: smooth; }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }

      /* Animation for Floating Logo */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }

      /* Entrance Animation (Login -> Dashboard) */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Exit Animation (Dashboard -> Login) */
      @keyframes fadeOutScale {
        from { opacity: 1; transform: scale(1); filter: blur(0px); }
        to { opacity: 0; transform: scale(0.95); filter: blur(4px); }
      }
      .animate-fade-out-scale {
        animation: fadeOutScale 0.4s ease-in forwards;
      }
      
      /* Simple Fade In (Login Appear) */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.8s ease-out forwards;
      }
    </style>
