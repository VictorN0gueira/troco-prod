  <style>
    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* Animation for Floating Logo */
    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    /* Entrance Animation (Login -> Dashboard) */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Exit Animation (Dashboard -> Login) */
    @keyframes fadeOutScale {
      from {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px);
      }

      to {
        opacity: 0;
        transform: scale(0.95);
        filter: blur(4px);
      }
    }

    .animate-fade-out-scale {
      animation: fadeOutScale 0.4s ease-in forwards;
    }

    /* Simple Fade In (Login Appear) */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* --- 21st.dev / Magic UI Style Animations --- */

    /* Shimmer Effect */
    @keyframes shimmer {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .animate-shimmer {
      background-size: 200% 200%;
      animation: shimmer 2s linear infinite;
    }

    /* Border Beam (Pseudo-border following) */
    @keyframes border-beam {
      100% {
        offset-distance: 100%;
      }
    }

    /* Grid / Pattern animations */
    @keyframes grid-move {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(40px);
      }
    }

    .animate-grid-move {
      animation: grid-move 20s linear infinite;
    }

    /* Text Reveal / Typing */
    @keyframes text-reveal {
      from {
        clip-path: inset(0 100% 0 0);
      }

      to {
        clip-path: inset(0 0 0 0);
      }
    }

    .animate-text-reveal {
      animation: text-reveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    /* Infinite Rotation (for glow/beam) */
    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }

    /* Premium Border Beam Utility */
    .border-beam {
      pointer-events: none;
      position: absolute;
      inset: 0;
      border: 2px solid transparent;
      border-radius: inherit;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      z-index: 10;
    }

    .border-beam::after {
      content: "";
      position: absolute;
      aspect-ratio: 1;
      width: 150px;
      background: linear-gradient(to right, #10B981, #3B82F6, transparent);
      offset-path: rect(0 auto auto 0 round 200px);
      animation: border-beam 4s linear infinite;
    }

    .dark .border-beam::after {
      background: linear-gradient(to right, #34d399, #60a5fa, transparent);
    }
  </style>
