  <style>
    /* Themes */
    body.theme-neon {

    /* Lightning Animation */
    @keyframes lightning {
      0%, 100% { opacity: 1; filter: brightness(1) drop-shadow(0 0 5px rgba(34,211,238,0.5)); transform: scale(1); }
      92% { opacity: 1; filter: brightness(1) drop-shadow(0 0 5px rgba(34,211,238,0.5)); }
      93% { opacity: 0.5; filter: brightness(2) drop-shadow(0 0 30px rgba(34,211,238,1)); transform: scale(1.02); }
      94% { opacity: 1; filter: brightness(1); transform: scale(1); }
      96% { opacity: 0.3; filter: brightness(3) drop-shadow(0 0 40px rgba(34,211,238,1)); transform: scale(1.05); }
      98% { opacity: 1; filter: brightness(1.5) drop-shadow(0 0 10px rgba(34,211,238,0.8)); transform: scale(1); }
    }
    .animate-lightning {
      animation: lightning 4s infinite;
    }

    /* Ice Animation */
    @keyframes frost {
      0% { box-shadow: 0 0 10px rgba(186, 230, 253, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.5); }
      50% { box-shadow: 0 0 25px rgba(186, 230, 253, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.8); }
      100% { box-shadow: 0 0 10px rgba(186, 230, 253, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.5); }
    }
    .animate-frost {
      animation: frost 3s ease-in-out infinite;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 20px;
      transition: background 0.3s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #10B981;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #10B981;
    }

    /* Hide scrollbar utility */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Animation for Floating Logo */
    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    /* Entrance Animation (Login -> Dashboard) */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Exit Animation (Dashboard -> Login) */
    @keyframes fadeOutScale {
      from {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px);
      }

      to {
        opacity: 0;
        transform: scale(0.95);
        filter: blur(4px);
      }
    }

    .animate-fade-out-scale {
      animation: fadeOutScale 0.4s ease-in forwards;
    }

    /* Simple Fade In (Login Appear) */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* --- 21st.dev / Magic UI Style Animations --- */

    /* Spin & Slide Effect (Shimmer Button Aceternity) */
    @keyframes spin-around {
      0% {
        transform: translateZ(0) rotate(0);
      }

      15%,
      35% {
        transform: translateZ(0) rotate(90deg);
      }

      65%,
      85% {
        transform: translateZ(0) rotate(270deg);
      }

      100% {
        transform: translateZ(0) rotate(360deg);
      }
    }

    .animate-spin-around {
      animation: spin-around calc(var(--speed) * 2) infinite linear;
    }

    @keyframes slide {
      to {
        transform: translate(calc(100cqw - 100%), 0);
      }
    }

    .animate-slide {
      animation: slide var(--speed) ease-in-out infinite alternate;
    }

    /* Shimmer Effect (Text/Bg) */
    @keyframes shimmer {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .animate-shimmer {
      background-size: 200% 200%;
      animation: shimmer 2s linear infinite;
    }

    /* Border Beam (Pseudo-border following) */
    @keyframes border-beam {
      100% {
        offset-distance: 100%;
      }
    }

    /* Grid / Pattern animations */
    @keyframes grid-move {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(40px);
      }
    }

    .animate-grid-move {
      animation: grid-move 20s linear infinite;
    }

    /* Text Reveal / Typing */
    @keyframes text-reveal {
      from {
        clip-path: inset(0 100% 0 0);
      }

      to {
        clip-path: inset(0 0 0 0);
      }
    }

    .animate-text-reveal {
      animation: text-reveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    /* Infinite Rotation (for glow/beam) */
    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }

    /* Premium Border Beam Utility */
    .border-beam {
      pointer-events: none;
      position: absolute;
      inset: 0;
      border: 2px solid transparent;
      border-radius: inherit;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      z-index: 10;
    }

    .border-beam::after {
      content: "";
      position: absolute;
      aspect-ratio: 1;
      width: 150px;
      background: linear-gradient(to right, #10B981, #3B82F6, transparent);
      offset-path: rect(0 auto auto 0 round 200px);
      animation: border-beam 4s linear infinite;
    }

    .dark .border-beam::after {
      background: linear-gradient(to right, #34d399, #60a5fa, transparent);
    }

    dotlottie-wc {
      display: block;
    }
