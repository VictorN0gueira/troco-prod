<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Gold Coin Body Gradient -->
    <linearGradient id="goldGradient" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FDB931"/>
      <stop offset="100%" stop-color="#C68E17"/>
    </linearGradient>
    
    <!-- Inner Rim Highlight -->
    <linearGradient id="rimHighlight" x1="256" y1="50" x2="256" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <!-- Emerald Green Detail Gradient -->
    <linearGradient id="emeraldGradient" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow for 3D effect -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="5" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Coin Body with Shadow -->
  <circle cx="256" cy="256" r="230" fill="url(#goldGradient)" filter="url(#dropShadow)" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Coin Rim (Bevel Effect) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#rimHighlight)" stroke-width="15"/>
  
  <!-- Inner Recess -->
  <circle cx="256" cy="256" r="185" fill="#FDF5E6" fill-opacity="0.1"/>

  <!-- The "T" Symbol (Stylized) -->
  <g transform="translate(136, 116) scale(0.47)"> 
    <!-- Using a bold, serif-like path for the T to look like currency symbol -->
    <path d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256 256-114.6 256-256S397.4 0 256 0z" fill="url(#emeraldGradient)" /> 
    <path d="M180 160h152c11 0 20-9 20-20v-20c0-11-9-20-20-20H180c-11 0-20 9-20 20v20c0 11 9 20 20 20zm64 40h24c11 0 20 9 20 20v220c0 11-9 20-20 20h-24c-11 0-20-9-20-20V220c0-11 9-20 20-20z" fill="#FFFFFF" transform="translate(0, 40)"/>
  </g>
  
  <!-- Shine Reflection -->
  <path d="M160 120 Q 256 60 352 120" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6" filter="blur(2px)"/>
</svg>
